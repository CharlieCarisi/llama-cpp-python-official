name: Build Windows Wheel with Python 3.9.1

on:
  workflow_dispatch:
    inputs:
      release_suffix:
        description: "Release suffix"
        required: true
        default: "py391-direct"
      runner:
        description: "Windows runner"
        required: true
        default: "windows-2022"
        type: choice
        options:
          - windows-2022

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-release:
    runs-on: ${{ github.event.inputs.runner }}

    steps:
      - name: Checkout fork source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify submodule patch
        shell: pwsh
        run: |
          git status
          git submodule status

          @'
          from pathlib import Path

          files = [
              Path("vendor/llama.cpp/common/common.cpp"),
              Path("vendor/llama.cpp/common/log.cpp"),
          ]

          for file in files:
              print("Checking", file)
              text = file.read_text(encoding="utf-8", errors="ignore")
              if "#include <chrono>" not in text:
                  raise RuntimeError(f"Missing #include <chrono> in {file}")
              print("OK")
          '@ | py -3 -c "import sys; exec(sys.stdin.read())"

      - name: Install Python 3.9.1 x64 manually
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://www.python.org/ftp/python/3.9.1/python-3.9.1-amd64.exe"
          $installer = "$env:RUNNER_TEMP\python-3.9.1-amd64.exe"
          $target = "$env:USERPROFILE\Python391"

          Invoke-WebRequest -Uri $url -OutFile $installer

          Start-Process -FilePath $installer -ArgumentList "/quiet InstallAllUsers=0 TargetDir=$target Include_pip=1 Include_launcher=0 PrependPath=0 Include_test=0" -Wait

          if (-not (Test-Path "$target\python.exe")) {
            throw "Python 3.9.1 install failed. python.exe not found."
          }

          & "$target\python.exe" --version
          & "$target\python.exe" -c "import sys; print(sys.version); assert sys.version.startswith('3.9.1'), sys.version"

          "PY391=$target\python.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install build dependencies using Python 3.9.1
        shell: pwsh
        run: |
          & $env:PY391 -c "import sys; print(sys.version); assert sys.version.startswith('3.9.1'), sys.version"
          & $env:PY391 -m pip install --upgrade "pip<26" setuptools wheel
          & $env:PY391 -m pip install "cmake==3.29.6" "ninja==1.11.1.1" "scikit-build-core==0.10.7" build uv
          & $env:PY391 -m pip list

      - name: Build wheel directly with Python 3.9.1
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path wheelhouse | Out-Null

          Remove-Item Env:CMAKE_ARGS -ErrorAction SilentlyContinue
          Remove-Item Env:FORCE_CMAKE -ErrorAction SilentlyContinue

          & $env:PY391 -c "import sys; print('BUILD PYTHON:', sys.version); assert sys.version.startswith('3.9.1'), sys.version"

          & $env:PY391 -m pip wheel . --no-deps --no-build-isolation -w wheelhouse -v

      - name: Generate wheel DLL hash report
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path reports | Out-Null

          @'
          import zipfile
          import hashlib
          from pathlib import Path

          wheels = list(Path("wheelhouse").glob("*.whl"))
          if not wheels:
              raise RuntimeError("No wheel found in wheelhouse")

          for wheel in wheels:
              print("Wheel:", wheel.name)
              print("Wheel size:", wheel.stat().st_size)
              print("Wheel sha256:", hashlib.sha256(wheel.read_bytes()).hexdigest())
              print()

              with zipfile.ZipFile(wheel, "r") as z:
                  dlls = sorted(name for name in z.namelist() if name.lower().endswith(".dll"))
                  for name in dlls:
                      data = z.read(name)
                      print(Path(name).name, len(data), hashlib.sha256(data).hexdigest(), name)
          '@ | & $env:PY391 | Tee-Object reports\wheel_dll_hashes.txt

      - name: Test wheel with Python 3.9.1 on runner
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path reports | Out-Null

          $wheel = Get-ChildItem wheelhouse -Filter "*.whl" | Select-Object -First 1
          if (-not $wheel) {
            throw "No wheel found."
          }

          & $env:PY391 -m venv testenv391
          .\testenv391\Scripts\python.exe -c "import sys; print(sys.version); assert sys.version.startswith('3.9.1'), sys.version"

          .\testenv391\Scripts\python.exe -m pip install --upgrade "pip<26" setuptools wheel
          .\testenv391\Scripts\python.exe -m pip install "numpy<2" diskcache jinja2 typing-extensions
          .\testenv391\Scripts\python.exe -m pip install --force-reinstall --no-deps $wheel.FullName

          @'
          import os
          import sys
          import platform
          import traceback
          import subprocess
          from pathlib import Path

          print("Python:", sys.version)
          print("Executable:", sys.executable)
          print("Platform:", platform.platform())

          if not sys.version.startswith("3.9.1"):
              raise RuntimeError("This test is not using Python 3.9.1")

          import llama_cpp
          print("llama_cpp version:", getattr(llama_cpp, "__version__", "unknown"))
          print("llama_cpp file:", llama_cpp.__file__)

          lib = Path(llama_cpp.__file__).resolve().parent / "lib"
          print("lib:", lib)

          for dll in sorted(lib.glob("*.dll")):
              print(dll.name, dll.stat().st_size)

          os.add_dll_directory(str(lib))

          from llama_cpp import llama_cpp as lc
          print("Native module:", lc)

          try:
              print("Calling llama_backend_init()")
              lc.llama_backend_init()
              print("llama_backend_init OK")
              lc.llama_backend_free()
              print("llama_backend_free OK")
          except Exception:
              print("llama_backend_init FAILED")
              traceback.print_exc()

          print()
          print("Loaded modules:")
          result = subprocess.run(
              f'tasklist /m /fi "PID eq {os.getpid()}"',
              shell=True,
              capture_output=True,
              text=True,
          )
          print(result.stdout)
          print(result.stderr)
          '@ | .\testenv391\Scripts\python.exe | Tee-Object reports\runner_py391_backend_test.txt

      - name: Show outputs
        shell: pwsh
        run: |
          Get-ChildItem wheelhouse | Format-Table Name, Length, LastWriteTime
          Get-ChildItem reports | Format-Table Name, Length, LastWriteTime

      - name: Create release tag
        shell: pwsh
        run: |
          $suffix = "${{ github.event.inputs.release_suffix }}"
          $runner = "${{ github.event.inputs.runner }}"
          $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"
          "RELEASE_TAG=llama-cpp-python-0.3.2-py391-$runner-$suffix-$timestamp" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body: |
            Custom Windows wheel for llama-cpp-python built directly with Python 3.9.1.

            Build method:
            - Forked source.
            - Patched llama.cpp submodule.
            - Manual Python 3.9.1 install.
            - Direct pip wheel build.
            - No cibuildwheel.
            - No setup-python.
            - No custom CMAKE_ARGS.

            Included reports:
            - wheel_dll_hashes.txt
            - runner_py391_backend_test.txt
          files: |
            wheelhouse/*.whl
            reports/*.txt
